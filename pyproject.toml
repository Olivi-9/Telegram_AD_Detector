[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-ad-detector"
version = "0.1.0"
description = "Telegram advertising detector bot and training utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "scipy>=1.15.3",
  "scikit-learn>=1.7.2",
  "joblib>=1.5.3",
  "sentence-transformers>=5.5.0",
  "transformers>=5.8.1",
  "huggingface-hub>=1.15.0",
  "typing-extensions>=4.15.0",
  "jieba>=0.42.1",
  "tqdm>=4.67.3",
  "accelerate>=1.13.0",
  "kurigram @ git+https://github.com/KurimuzonAkuma/kurigram@dev",
  "matplotlib>=3.10.9",
  "seaborn>=0.13.2",
  "python-dotenv>=1.0.1",
]

[project.scripts]
telegram-ad-bot = "telegram_ad_detector.cli:bot"
telegram-ad-predict = "telegram_ad_detector.cli:predict"
telegram-ad-train = "telegram_ad_detector.cli:train"

[tool.setuptools]
py-modules = [
  "ad_bot",
  "bot_config",
  "change_row",
  "clean_chat_log",
  "clean_short_rows",
  "data",
  "detection_engine",
  "main",
  "noise",
  "predict",
  "test_pytorch",
  "user_state",
  "visualize_svm",
]

[tool.setuptools.packages.find]
include = ["telegram_ad_detector*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
